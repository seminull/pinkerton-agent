# The production front door: serves the built client and proxies /api to the
# Node server, which is what makes the client's relative /api paths same-origin
# (see apps/web/src/api/client.ts). Plain HTTP on purpose — TLS terminates in
# front of this host, never inside the stack.

# Password guessing is throttled here, in front of the API, for two reasons: a
# guess that never reaches Node costs nothing, and each one that does costs a
# deliberate 64 MiB of Argon2 (server/password.ts) — unthrottled, a few dozen
# parallel requests would be enough to push the API into its memory ceiling.
#
# Keyed on the visitor's address. Behind Cloudflare every connection arrives
# from the tunnel, so the real client is in CF-Connecting-IP (which Cloudflare
# sets itself and a visitor cannot forge); the socket address is the fallback
# for a deployment with nothing in front.
map $http_cf_connecting_ip $login_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $login_client zone=login:1m rate=10r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with the variable in proxy_pass below it
    # makes nginx re-resolve `api` at request time; a literal upstream is
    # resolved once at startup, so a rebuilt api container (new IP) would leave
    # this one proxying to a dead address until it was restarted too.
    resolver 127.0.0.11 valid=10s;

    # Ten attempts a minute per address, with a burst of five so a person
    # fumbling a password isn't punished — only a script is.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        set $api_upstream http://api:3040;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        set $api_upstream http://api:3040;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passed through, not $scheme: this listener is always http, and the
        # proxy in front of it is the only thing that knows the visitor's.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite fingerprints everything under /assets, so a filename never changes
    # content and can be cached forever. A miss is a real 404 — falling back to
    # index.html here would hand a browser HTML where it asked for JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The one file that must never be cached: it names the current fingerprinted
    # bundle, so a stale copy pins a visitor to a deploy that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/contacts/12, ...) exist only in React Router; serve
    # the app shell for any path that isn't a real file.
    location / {
        try_files $uri /index.html;
    }
}
